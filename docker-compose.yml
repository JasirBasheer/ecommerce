services:
  ecommerce:
    build: .
    container_name: ecommerce
    ports:
      - "3015:3015"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - ecommerce-network
    volumes:
      - ./public:/usr/app/public
    
networks:
  ecommerce-network:
    external: true
    labels:
      project: "Ecommerce"
