name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start SSH agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p $HOME/.ssh
          ssh-keyscan -H ${{ secrets.VM_INSTANCE_IP }} >> $HOME/.ssh/known_hosts
          chmod 644 $HOME/.ssh/known_hosts

      - name: Deploy on VM
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=$HOME/.ssh/known_hosts ${{ secrets.VM_SSH_USER }}@${{ secrets.VM_INSTANCE_IP }} << 'EOF'
            set -e

            echo "Pulling latest code..."
            cd /opt/projects/ecommerce || exit 1
            git pull origin main

            echo "Cleaning old Docker resources..."
            sudo docker ps -a --filter "label=project=Ecommerce" -q | xargs -r sudo docker rm -f
            sudo docker images --filter "label=project=Ecommerce" -q | xargs -r sudo docker rmi -f
            sudo docker volume ls --filter "label=project=Ecommerce" -q | xargs -r sudo docker volume rm -f
            sudo docker network ls --filter "label=project=Ecommerce" -q | xargs -r sudo docker network rm -f

            echo "Rebuilding and restarting containers..."
            sudo docker compose up --build -d

            echo "Deployment completed!"
          EOF
