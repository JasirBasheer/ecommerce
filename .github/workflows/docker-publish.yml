name: Deploy Ecommerce to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Setup SSH known_hosts
        run: |
          SSH_DIR=/home/runner/.ssh
          mkdir -p $SSH_DIR
          ssh-keyscan -H ${{ secrets.VM_INSTANCE_IP }} >> $SSH_DIR/known_hosts
          chmod 644 $SSH_DIR/known_hosts

      - name: Deploy on VM
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/home/runner/.ssh/known_hosts \
              ${{ secrets.VM_SSH_USER }}@${{ secrets.VM_INSTANCE_IP }} << 'EOF'
            set -e

            echo "Pulling latest code..."
            cd /opt/projects/ecommerce
            git pull origin main

            echo "Cleaning old Docker resources..."
            sudo docker ps -a --filter "label=project=Ecommerce" -q | xargs -r sudo docker rm -f
            sudo docker images --filter "label=project=Ecommerce" -q | xargs -r sudo docker rmi -f
            sudo docker volume ls --filter "label=project=Ecommerce" -q | xargs -r sudo docker volume rm -f
            sudo docker network ls --filter "label=project=Ecommerce" -q | xargs -r sudo docker network rm -f

            echo "Rebuilding containers..."
            sudo docker compose up --build -d

            echo "Deployment completed!"
          EOF
